# Categories for the release notes GitHub generates for each tag, built from
# the titles of the PRs merged since the previous one. release-please asks
# GitHub for these notes (changelog-type: github in
# release-please-config.json), and so does publish.yml for a tag pushed by
# hand.
#
# A PR lands in the first category it matches, so the catch-all is last.
# workflows/label-by-title.yml sets the label from the PR title's type, and
# this file and that workflow name the same labels. A label set by hand
# places a PR the same way until its title is edited; an unlabelled one
# still appears, under Other.
changelog:
  exclude:
    labels:
      - skip-changelog
      # release-please's own release PR, merged right before each tag, which
      # would otherwise list itself.
      - 'autorelease: pending'
      - 'autorelease: tagged'
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - bug
        - fix
    - title: 📖 Documentation
      labels:
        - documentation
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: Other
      labels:
        - '*'
