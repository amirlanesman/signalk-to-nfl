name: Publish Package

# Publishes the tag it runs on to npm. Release tags come from release-please:
# merging its release PR creates the tag and the GitHub Release, then
# release-please.yml dispatches this workflow on the tag. A tag pushed by
# hand starts it through the tag trigger, and the Release is then created
# here, after the publish succeeded.
on:
  push:
    tags:
      - 'v*'
  # How release-please.yml starts this on a tag it created: that tag, pushed
  # with GITHUB_TOKEN, raises no push event.
  workflow_dispatch:

permissions: {}

jobs:
  # npm publishes package.json's version whatever the tag is called, and
  # neither the `v*` filter nor a dispatch checks the name. Checked before
  # anything else, so a mismatched tag gets neither a publish nor a Release.
  # A dispatch can name any ref; one that is not a release tag skips this
  # job, and with it the rest.
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag names package.json's version
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version - refusing to publish."
            exit 1
          fi

  publish:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: npm mints a short-lived credential from this
      # OIDC token, so there is no npm token to store or rotate.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Clean workspace
        run: git clean -xfd

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci

      - name: Build
        run: |
          npm run build
          echo "Checking dist folder:"
          ls -la dist/

      - run: npm test

      - name: Publish
        env:
          # Read from the environment, never interpolated into the script: a
          # tag name is chosen by whoever pushes it.
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/*-beta.* ]] || [[ "$REF" == refs/tags/*-rc.* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi

  release:
    needs: publish
    # On a dispatch release-please has created the Release already.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
